services:
    app:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: player-scorer-app
        restart: unless-stopped
        working_dir: /var/www/html
        volumes:
            - .:/var/www/html
            # Keep container-managed dependency dirs out of the host bind mount.
            - /var/www/html/vendor
            - /var/www/html/node_modules
        ports:
            - "8000:8000"
            - "5173:5173"
        environment:
            DB_CONNECTION: mysql
            DB_HOST: mysql
            DB_PORT: 3306
            DB_DATABASE: player_scorer
            DB_USERNAME: player_scorer
            DB_PASSWORD: secret
        depends_on:
            mysql:
                condition: service_healthy
        networks:
            - player-scorer

    mysql:
        image: mysql:8.0
        container_name: player-scorer-mysql
        restart: unless-stopped
        environment:
            MYSQL_DATABASE: player_scorer
            MYSQL_USER: player_scorer
            MYSQL_PASSWORD: secret
            MYSQL_ROOT_PASSWORD: root
        ports:
            - "3306:3306"
        volumes:
            - player-scorer-mysql:/var/lib/mysql
        healthcheck:
            test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
            interval: 5s
            timeout: 5s
            retries: 20
        networks:
            - player-scorer

networks:
    player-scorer:
        driver: bridge

volumes:
    player-scorer-mysql:
        driver: local
